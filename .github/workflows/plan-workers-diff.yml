name: Plan workers diff

on:
    pull_request:
        paths:
            - '**/nextnode.toml'

jobs:
    plan-infra:
        uses: NextNodeSolutions/core/.github/workflows/plan-workers-diff.yml@main
        with:
            environment: production
        secrets: inherit
        # The called workflow asks for both: a job-level block sets every
        # permission it omits to none, and GitHub then refuses to start it.
        permissions:
            contents: read
            pull-requests: write
